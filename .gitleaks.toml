# gitleaks default rules. The Turnstile *site* key is public by design (it is in
# every page), so that exact key is allowed. Never add an empty or broad pattern:
# it would hide every finding. Secret keys never go in the repo.
[extend]
useDefault = true

[allowlist]
description = "Public Turnstile site key"
regexes = ['''0x4AAAAAAFqYBIq8NNXM5hHi''']
